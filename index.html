<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; text-align:center; font-family:sans-serif;">
  <canvas id="game" width="400" height="400" style="background:#fff; max-width:100%; touch-action:none;"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ★ 追加：プレゼント画像を読み込む（ファイル名は present.png）
    const giftImg = new Image();
    giftImg.src = "present.png";

    const TIME_LIMIT = 30;
    let x = 180;
    let items = [];
    let score = 0;
    let timeLeft = TIME_LIMIT;
    let state = "playing";
    let gameOverReason = "";

    const spawner = setInterval(() => {
      if (state !== "playing") return;
      const isBomb = Math.random() < 0.3;
      items.push({
        x: Math.random() * 360,
        y: 0,
        type: isBomb ? "bomb" : "gift",
      });
    }, 700);

    const timer = setInterval(() => {
      if (state !== "playing") return;
      timeLeft -= 1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        endGame("時間切れ！");
      }
    }, 1000);

    function endGame(reason) {
      state = "over";
      gameOverReason = reason;
      clearInterval(spawner);
      clearInterval(timer);
    }

    function update() {
      if (state === "playing") {
        for (const it of items) {
          it.y += 3;
        }

        items = items.filter((it) => {
          const hitBox = it.y + 20 >= 360 && it.y <= 400 && it.x + 20 >= x && it.x <= x + 40;
          if (hitBox) {
            if (it.type === "bomb") {
              endGame("爆弾に触れた！");
            } else {
              score += 1;
            }
            return false;
          }
          return it.y < 400;
        });
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 400);

      // 赤い受け皿
      ctx.fillStyle = "red";
      ctx.fillRect(x, 360, 40, 40);

      // ★ 変更：プレゼントは画像で描く／爆弾は黒い四角のまま
      for (const it of items) {
        if (it.type === "bomb") {
          ctx.fillStyle = "black";
          ctx.fillRect(it.x, it.y, 20, 20);
        } else if (giftImg.complete && giftImg.naturalWidth > 0) {
          ctx.drawImage(giftImg, it.x, it.y, 20, 20);
        } else {
          // 画像がまだ読めない時の代わり（緑の四角）
          ctx.fillStyle = "green";
          ctx.fillRect(it.x, it.y, 20, 20);
        }
      }

      ctx.fillStyle = "black";
      ctx.font = "24px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("点数: " + score, 10, 30);
      ctx.textAlign = "right";
      ctx.fillText("残り: " + timeLeft + "秒", 390, 30);

      if (state === "over") {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, 400, 400);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "32px sans-serif";
        ctx.fillText("ゲーム終了", 200, 160);
        ctx.font = "24px sans-serif";
        ctx.fillText(gameOverReason, 200, 200);
        ctx.fillText("点数: " + score + " 点", 200, 240);
        ctx.font = "18px sans-serif";
        ctx.fillText("画面をタップでもう一度", 200, 290);
      }
    }

    function moveTo(clientX) {
      const rect = canvas.getBoundingClientRect();
      const px = (clientX - rect.left) * (canvas.width / rect.width);
      x = Math.max(0, Math.min(360, px - 20));
    }

    function restartIfOver() {
      if (state === "over") location.reload();
    }

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      restartIfOver();
      if (state === "playing") moveTo(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (state === "playing") moveTo(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener("mousemove", (e) => {
      if (state === "playing" && e.buttons === 1) moveTo(e.clientX);
    });

    canvas.addEventListener("click", restartIfOver);

    document.addEventListener("keydown", (e) => {
      if (state !== "playing") return;
      if (e.key === "ArrowLeft")  x = Math.max(0, x - 10);
      if (e.key === "ArrowRight") x = Math.min(360, x + 10);
    });

    update();
  </script>
</body>
</html>
